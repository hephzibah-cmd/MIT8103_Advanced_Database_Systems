# PostgreSQL 16 Replica Configuration (Hot Standby)
# ApexBank Digital - Distributed Database Portfolio 5

# --- Connection settings ---
listen_addresses = '*'
port = 5432
max_connections = 100

# --- Standby mode ---
hot_standby = on
hot_standby_feedback = on
max_standby_streaming_delay = 30s
max_standby_archive_delay = 30s
wal_receiver_status_interval = 10s
# primary_conninfo / primary_slot_name are written to postgresql.auto.conf
# (plus standby.signal) by `pg_basebackup -R -S replica_N_slot` at first start.
# recovery_target_timeline defaults to 'latest', so after a failover this
# standby can follow the promoted node once primary_conninfo is repointed.

# --- Logging ---
log_statement = 'all'
log_min_duration_statement = 200ms
log_line_prefix = '%t [%p] user=%u,db=%d,app=%a,client=%h '

# --- Statistics ---
track_commit_timestamp = on
track_io_timing = on
