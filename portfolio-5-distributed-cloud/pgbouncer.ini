; ApexBank Digital - Portfolio 5 pgBouncer (DEV-ONLY credentials)
[databases]
; Read/write split: pgBouncer does NOT split reads/writes or detect failover
; itself. Each logical database name below is a separate pool; the
; application chooses `apexbank` (primary) for writes and strongly
; consistent reads, and `apexbank_replica_N` for stale-tolerant reads.
apexbank = host=mit8103-pg-primary port=5432 dbname=apexbank
apexbank_replica_1 = host=mit8103-pg-replica-1 port=5432 dbname=apexbank
apexbank_replica_2 = host=mit8103-pg-replica-2 port=5432 dbname=apexbank

[pgbouncer]
listen_port = 6432
listen_addr = *

; Clients authenticate to pgBouncer with SCRAM; pgBouncer then logs in to
; PostgreSQL (scram-sha-256 in pg_hba) with the password from auth_file.
; userlist.txt holds a plaintext dev password; in production store SCRAM
; secrets (copied from pg_authid) or use auth_query instead.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = apexbank

; --- Pool mode ---
; Transaction pooling: a server connection is returned to the pool at COMMIT,
; so session state (SET, advisory locks, LISTEN/NOTIFY, temp tables, WITH HOLD
; cursors) must not be relied upon. Protocol-level prepared statements are
; tracked by pgBouncer (>= 1.21) only when max_prepared_statements > 0.
pool_mode = transaction
max_prepared_statements = 100
max_client_conn = 100
default_pool_size = 25
reserve_pool_size = 5
reserve_pool_timeout = 3
