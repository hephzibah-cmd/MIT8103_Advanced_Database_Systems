# PostgreSQL 16 Primary Configuration (Leader)
# ApexBank Digital - Distributed Database Portfolio 5

# --- Connection settings ---
listen_addresses = '*'
port = 5432
max_connections = 100

# --- Write-ahead logging (replication) ---
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 256MB
wal_sender_timeout = 60s
# Required for pg_rewind of this node after a failover (the postgres image
# does not enable data checksums at initdb).
wal_log_hints = on
# Ignored while this node is primary; lets it serve reads if it is later
# demoted and rejoined as a standby.
hot_standby = on

# --- Replication durability ---
# Replication is ASYNCHRONOUS (PostgreSQL default): COMMIT returns once WAL is
# flushed locally on the primary. A commit acknowledged just before a primary
# crash may not yet be on any standby, so failover RPO > 0.
# For RPO = 0 on ledger writes, enable quorum synchronous replication:
#   synchronous_standby_names = 'ANY 1 (replica_1, replica_2)'
#   synchronous_commit = on          # or remote_apply for read-your-writes on replicas
# (cost: higher commit latency; writes block if no standby is reachable).
synchronous_standby_names = ''
synchronous_commit = on

# --- Logging ---
log_statement = 'all'
log_min_duration_statement = 200ms
log_line_prefix = '%t [%p] user=%u,db=%d,app=%a,client=%h '

# --- Statistics ---
track_commit_timestamp = on
track_io_timing = on

# --- Planner ---
random_page_cost = 1.1
effective_cache_size = 256MB
