services:
  postgres:
    image: postgres:16
    container_name: mit8103-postgres
    environment:
      POSTGRES_USER: apexbank
      POSTGRES_PASSWORD: apexbank_dev
      POSTGRES_DB: apexbank
    ports:
      - "5432:5432"
    volumes:
      - apexbank_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apexbank -d apexbank"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  apexbank_pgdata:
