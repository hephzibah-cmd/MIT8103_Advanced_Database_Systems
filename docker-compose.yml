services:
  postgres:
    image: postgres:16
    container_name: mit8103-postgres
    environment:
      POSTGRES_USER: apexbank
      POSTGRES_PASSWORD: apexbank_dev
      POSTGRES_DB: apexbank
    ports:
      - "5432:5432"
    volumes:
      - apexbank_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apexbank -d apexbank"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongo:
    image: mongo:7.0
    container_name: mit8103-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: apexbank
      MONGO_INITDB_ROOT_PASSWORD: apexbank_dev
      MONGO_INITDB_DATABASE: apexbank
    ports:
      - "27017:27017"
    volumes:
      - apexbank_mongodata:/data/db

volumes:
  apexbank_pgdata:
  apexbank_mongodata:
